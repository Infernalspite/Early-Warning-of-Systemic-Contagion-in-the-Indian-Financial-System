name: Daily Dashboard Update

on:
  schedule:
    # 12:30 UTC = 6:00 PM IST, Mon-Fri (after NSE close at 3:30 PM IST)
    - cron: "30 12 * * 1-5"
  workflow_dispatch:   # Allow manual trigger from GitHub UI

permissions:
  contents: write      # needed to push the updated JSON back

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # 2. Python setup
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install only what the dashboard builder needs
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas yfinance fredapi scikit-learn requests

      # 4. Update config end date to today
      - name: Set end date to today
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s|  end:.*|  end:   \"$TODAY\"|" config/config.yaml
          echo "Updated end date to $TODAY"

      # 5. Regenerate dashboard JSON
      - name: Regenerate dashboard_data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build_dashboard_json.py

      # 6. Check if data changed
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet web/data/dashboard_data.json docs/data/dashboard_data.json web/index.html docs/index.html config/config.yaml \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      # 7. Commit and push if changed
      - name: Commit updated dashboard data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/dashboard_data.json docs/data/dashboard_data.json web/index.html docs/index.html config/config.yaml
          git commit -m "chore: auto-update dashboard data $(date -u +'%Y-%m-%d')"
          git push origin HEAD:master
          git push origin HEAD:main

      - name: No changes to commit
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "Dashboard data is already up to date."
